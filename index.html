<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Redes e Microrredes</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface2:#eef0f4;--text:#1b1f27;--muted:#667085;--border:#dfe3ea;--accent:#3b6df0;--accent-soft:#e3ebff;--bar:#9db6f7;--mark:#ffe58a;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--surface:#1a1d24;--surface2:#232731;--text:#e8eaf0;--muted:#9aa3b2;--border:#2c313c;--accent:#7a9cff;--accent-soft:#25304d;--bar:#34508f;--mark:#6b5a10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--surface:#1a1d24;--surface2:#232731;--text:#e8eaf0;--muted:#9aa3b2;--border:#2c313c;--accent:#7a9cff;--accent-soft:#25304d;--bar:#34508f;--mark:#6b5a10;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:12px}
button,select,input{font:inherit;color:var(--text)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:5px 10px;font-size:12px}
.drop{border:2px dashed var(--border);border-radius:14px;background:var(--surface);padding:48px 20px;text-align:center;margin-top:30px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{color:var(--muted);margin:8px 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.card b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.card span{color:var(--muted);font-size:12px}
.scope{color:var(--muted);font-size:12px;margin:0 0 14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:flex-start}
.tools>input[type=search]{flex:1 1 240px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.tools select{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.ms{position:relative}
.msb{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:230px;text-align:left;display:flex;justify-content:space-between;gap:10px}
.msb.on{border-color:var(--accent);background:var(--accent-soft)}
.panel{position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:min(420px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px}
.panel input[type=search]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.pact{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.opts{max-height:300px;overflow:auto;border-top:1px solid var(--border)}
.opt{display:flex;gap:10px;align-items:center;padding:7px 6px;cursor:pointer;border-radius:6px}
.opt:hover{background:var(--surface2)}
.opt input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.opt span{flex:1;min-width:0}
.opt em{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{background:var(--accent-soft);border:1px solid var(--border);border-radius:999px;padding:3px 6px 3px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
.chip button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 2px}
.info{color:var(--muted);font-size:12px;margin:0 0 10px}
.rede{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.rh,.ch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:12px 14px}
.rh:hover,.ch:hover{background:var(--surface2)}
.chev{width:14px;color:var(--muted);transition:transform .15s;flex:none}
.open>.rh .chev,.open>.ch .chev{transform:rotate(90deg)}
.nm{flex:1;min-width:0;font-weight:600}
.nm small{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{text-align:right;min-width:92px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:15px}.stat span{font-size:11px;color:var(--muted)}
.bar{height:4px;background:var(--surface2)}
.bar i{display:block;height:100%;background:var(--bar)}
.cels{border-top:1px solid var(--border);background:var(--bg);padding:6px 8px 8px}
.cel{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-top:6px;overflow:hidden}
.ch{padding:10px 12px}
.ppl{border-top:1px solid var(--border);max-height:460px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 12px}
td{padding:6px 12px;border-top:1px solid var(--border)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Painel de Redes e Microrredes</h1>
      <div class="sub" id="fileinfo">Carregando a planilha do repositório…</div>
    </div>
    <div><button class="btn ghost hide" id="swap">Trocar planilha</button></div>
  </header>

  <div class="drop" id="drop">
    <h2 style="margin:0">Não foi possível carregar a planilha automaticamente</h2>
    <p>Confira se o arquivo <strong>participantes.xlsx</strong> está na raiz do repositório, junto com o index.html. Se preferir, selecione a planilha manualmente.</p>
    <button class="btn" id="pick">Escolher planilha</button>
  </div>
  <input type="file" id="file" accept=".xlsx,.xls,.csv" class="hide">

  <div id="app" class="hide">
    <div class="cards" id="cards"></div>
    <p class="scope" id="scope"></p>

    <div class="tools">
      <div class="ms" id="ms">
        <button class="msb" id="msb" aria-haspopup="true"><span id="mslabel">Selecione as redes que deseja analisar</span><span>▾</span></button>
        <div class="panel hide" id="panel">
          <input type="search" id="msq" placeholder="Buscar rede…" autocomplete="off">
          <div class="pact">
            <button class="btn ghost sm" id="markAll">Marcar as listadas</button>
            <button class="btn ghost sm" id="clearSel">Limpar seleção</button>
          </div>
          <div class="opts" id="opts"></div>
        </div>
      </div>
      <input type="search" id="q" placeholder="Buscar por nome, rede, microrrede ou facilitador…" autocomplete="off">
      <select id="sort" aria-label="Ordenar">
        <option value="size">Mais participantes</option>
        <option value="cels">Mais microrredes</option>
        <option value="name">Nome (A–Z)</option>
      </select>
      <button class="btn ghost" id="expand">Expandir redes</button>
      <button class="btn ghost" id="collapse">Recolher tudo</button>
    </div>
    <div class="chips" id="chips"></div>
    <p class="info" id="info"></p>
    <div id="list"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const clean = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
const norm = s => String(s).split('').map(c => c.normalize('NFD').replace(/[\u0300-\u036f]/g, '')).join('').toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString('pt-BR');

let redes = [], q = '', nq = '', mq = '';
const sel = new Set();
const overR = new Map(), overC = new Map();

function pick(row, names) {
  const keys = Object.keys(row);
  for (const n of names) { const k = keys.find(k => norm(clean(k)) === n); if (k) return k; }
  return null;
}

function build(rows) {
  if (!rows.length) throw new Error('Planilha vazia.');
  const r0 = rows[0];
  const kN = pick(r0, ['nome']), kC = pick(r0, ['celula', 'microrrede']), kR = pick(r0, ['rede']),
        kL = pick(r0, ['lideres', 'facilitador', 'lider']), kP = pick(r0, ['perfil na igreja', 'perfil']);
  if (!kN || !kC || !kR) throw new Error('Não encontrei as colunas Nome, Célula e Rede.');
  const map = new Map();
  for (const row of rows) {
    const rn = clean(row[kR]) || '(sem rede)', cn = clean(row[kC]) || '(sem microrrede)', nome = clean(row[kN]);
    if (!nome) continue;
    let r = map.get(rn);
    if (!r) map.set(rn, r = { name: rn, nn: norm(rn), cm: new Map() });
    let c = r.cm.get(cn);
    if (!c) r.cm.set(cn, c = { name: cn, nn: norm(cn), lider: '', ln: '', people: [] });
    if (!c.lider && kL) { c.lider = clean(row[kL]); c.ln = norm(c.lider); }
    c.people.push({ n: nome, nn: norm(nome), perfil: kP ? clean(row[kP]) : '' });
  }
  redes = [...map.values()].map(r => {
    r.cels = [...r.cm.values()];
    r.cels.forEach(c => c.people.sort((a, b) => a.n.localeCompare(b.n, 'pt-BR')));
    r.cels.sort((a, b) => b.people.length - a.people.length);
    r.count = r.cels.reduce((s, c) => s + c.people.length, 0);
    return r;
  }).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  redes.forEach((r, i) => r.i = i);
}

function processWorkbook(data, label) {
  const wb = XLSX.read(data, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  if (!sheet) throw new Error('A planilha não possui uma aba válida.');
  build(XLSX.utils.sheet_to_json(sheet, { defval: '' }));
  $('#fileinfo').textContent = label + ' · ' + fmt(redes.reduce((s, r) => s + r.count, 0)) + ' participantes carregados';
  $('#drop').classList.add('hide'); $('#app').classList.remove('hide'); $('#swap').classList.remove('hide');
  q = nq = mq = ''; $('#q').value = ''; $('#msq').value = ''; sel.clear(); overR.clear(); overC.clear();
  renderOpts(); render();
}

function load(file) {
  const fr = new FileReader();
  fr.onload = e => {
    try { processWorkbook(e.target.result, file.name); }
    catch (err) { alert('Erro ao ler a planilha: ' + err.message); }
  };
  fr.onerror = () => alert('Não consegui ler esse arquivo. Tente selecionar a planilha novamente.');
  fr.readAsArrayBuffer(file);
}

async function loadFromRepository() {
  try {
    const response = await fetch('./participantes.xlsx?v=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('Arquivo participantes.xlsx não encontrado (' + response.status + ').');
    const buffer = await response.arrayBuffer();
    processWorkbook(buffer, 'participantes.xlsx');
  } catch (err) {
    $('#fileinfo').textContent = 'Aguardando uma planilha válida no repositório.';
    $('#drop').classList.remove('hide');
    console.error('Falha ao carregar participantes.xlsx:', err);
  }
}

function hl(text) {
  if (!nq) return esc(text);
  const n = norm(text), i = n.indexOf(nq);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + nq.length)) + '</mark>' + esc(text.slice(i + nq.length));
}

const scoped = () => sel.size ? redes.filter(r => sel.has(r.i)) : redes;

function view() {
  const out = [];
  for (const r of scoped()) {
    if (!nq) { out.push({ r, cels: r.cels.map((c, ci) => ({ c, ci, people: c.people, partial: false })), n: r.count }); continue; }
    const rm = r.nn.includes(nq), cels = [];
    r.cels.forEach((c, ci) => {
      if (rm || c.nn.includes(nq) || c.ln.includes(nq)) cels.push({ c, ci, people: c.people, partial: false });
      else { const pp = c.people.filter(p => p.nn.includes(nq)); if (pp.length) cels.push({ c, ci, people: pp, partial: true }); }
    });
    if (cels.length) out.push({ r, cels, n: cels.reduce((s, x) => s + x.people.length, 0) });
  }
  const s = $('#sort').value;
  out.sort((a, b) => s === 'name' ? a.r.name.localeCompare(b.r.name, 'pt-BR') : s === 'cels' ? b.cels.length - a.cels.length : b.n - a.n);
  return out;
}

function renderOpts() {
  const f = norm(mq.trim());
  const list = redes.filter(r => !f || r.nn.includes(f));
  $('#opts').innerHTML = list.length ? list.map(r =>
    `<label class="opt"><input type="checkbox" data-i="${r.i}" ${sel.has(r.i) ? 'checked' : ''}><span>${esc(r.name)}</span><em>${fmt(r.count)}</em></label>`
  ).join('') : '<div class="empty">Nenhuma rede.</div>';
  $('#markAll').dataset.ids = list.map(r => r.i).join(',');
  const n = sel.size;
  $('#mslabel').textContent = n ? `${n} rede${n > 1 ? 's' : ''} selecionada${n > 1 ? 's' : ''}` : 'Selecione as redes que deseja analisar';
  $('#msb').classList.toggle('on', n > 0);
  $('#chips').innerHTML = [...sel].sort((a, b) => a - b).map(i =>
    `<span class="chip">${esc(redes[i].name)}<button data-x="${i}" aria-label="Remover">×</button></span>`).join('');
}

function render() {
  const base = scoped();
  const tc = base.reduce((s, r) => s + r.cels.length, 0), tp = base.reduce((s, r) => s + r.count, 0);
  $('#cards').innerHTML = [['Redes', base.length], ['Microrredes', tc], ['Participantes', tp]]
    .map(([l, v]) => `<div class="card"><b>${fmt(v)}</b><span>${l}</span></div>`).join('');
  $('#scope').textContent = sel.size ? 'Totais somando apenas as redes selecionadas.' : 'Totais de todas as redes. Selecione redes para somar só as suas.';
  const v = view(), max = Math.max(1, ...v.map(x => x.n));
  $('#info').textContent = nq
    ? `${fmt(v.length)} rede(s) · ${fmt(v.reduce((s, x) => s + x.cels.length, 0))} microrrede(s) · ${fmt(v.reduce((s, x) => s + x.n, 0))} participante(s) para “${q.trim()}”`
    : 'Clique em uma rede para ver as microrredes e em uma microrrede para ver os participantes.';
  if (!v.length) { $('#list').innerHTML = '<div class="empty">Nada encontrado.</div>'; return; }
  const autoR = (nq || sel.size) && v.length <= 5;
  $('#list').innerHTML = v.map(x => {
    const rk = x.r.i, rOpen = overR.has(rk) ? overR.get(rk) : autoR;
    let body = '';
    if (rOpen) {
      body = '<div class="cels">' + x.cels.map(y => {
        const ck = rk + '/' + y.ci, cOpen = overC.has(ck) ? overC.get(ck) : y.partial;
        let ppl = '';
        if (cOpen) ppl = '<div class="ppl"><table><thead><tr><th>Nome</th><th>Perfil</th></tr></thead><tbody>' +
          y.people.map(p => `<tr><td>${hl(p.n)}</td><td>${esc(p.perfil || '–')}</td></tr>`).join('') + '</tbody></table></div>';
        return `<div class="cel ${cOpen ? 'open' : ''}"><button class="ch" data-c="${ck}"><span class="chev">▸</span>
          <span class="nm">${hl(y.c.name)}<small>${y.c.lider ? 'Facilitador(es): ' + hl(y.c.lider) : ''}</small></span>
          <span class="stat"><b>${fmt(y.people.length)}</b><span>participantes</span></span></button>${ppl}</div>`;
      }).join('') + '</div>';
    }
    return `<div class="rede ${rOpen ? 'open' : ''}"><button class="rh" data-r="${rk}"><span class="chev">▸</span>
      <span class="nm">${hl(x.r.name)}</span>
      <span class="stat"><b>${fmt(x.cels.length)}</b><span>microrredes</span></span>
      <span class="stat"><b>${fmt(x.n)}</b><span>participantes</span></span></button>
      <div class="bar"><i style="width:${(x.n / max * 100).toFixed(1)}%"></i></div>${body}</div>`;
  }).join('');
}

$('#list').addEventListener('click', e => {
  const rb = e.target.closest('[data-r]'), cb = e.target.closest('[data-c]');
  if (cb) { overC.set(cb.dataset.c, !cb.parentElement.classList.contains('open')); render(); }
  else if (rb) { overR.set(+rb.dataset.r, !rb.parentElement.classList.contains('open')); render(); }
});
let t;
$('#q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { q = e.target.value; nq = norm(q.trim()); overR.clear(); overC.clear(); render(); }, 200); });
$('#sort').addEventListener('change', render);
$('#expand').addEventListener('click', () => { view().forEach(x => overR.set(x.r.i, true)); render(); });
$('#collapse').addEventListener('click', () => { redes.forEach(r => overR.set(r.i, false)); overC.clear(); render(); });

const changed = () => { overR.clear(); overC.clear(); renderOpts(); render(); };
$('#msb').addEventListener('click', () => { $('#panel').classList.toggle('hide'); if (!$('#panel').classList.contains('hide')) $('#msq').focus(); });
document.addEventListener('click', e => { if (!e.target.closest('#ms')) $('#panel').classList.add('hide'); });
$('#msq').addEventListener('input', e => { mq = e.target.value; renderOpts(); });
$('#opts').addEventListener('change', e => {
  const i = +e.target.dataset.i;
  e.target.checked ? sel.add(i) : sel.delete(i);
  overR.clear(); overC.clear(); renderOpts(); render();
});
$('#markAll').addEventListener('click', e => { (e.currentTarget.dataset.ids || '').split(',').filter(Boolean).forEach(i => sel.add(+i)); changed(); });
$('#clearSel').addEventListener('click', () => { sel.clear(); changed(); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (b) { sel.delete(+b.dataset.x); changed(); } });

$('#pick').addEventListener('click', () => $('#file').click());
$('#swap').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { if (e.target.files[0]) load(e.target.files[0]); e.target.value = ''; });
const dz = $('#drop');
['dragover', 'dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', e => { if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });

loadFromRepository();
</script>
</body>
</html>
